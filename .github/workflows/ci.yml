name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # setup-node's built-in `cache: pnpm` asks pnpm for its store path before
      # anything is installed, then fails because that directory does not exist
      # yet. Pinning the store ourselves keeps the cache key explicit.
      - name: Configure pnpm store
        run: |
          echo "PNPM_STORE_PATH=$HOME/.pnpm-store" >> "$GITHUB_ENV"
          pnpm config set store-dir "$HOME/.pnpm-store" --global
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('portfolio/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run types:check
      - name: Lint
        run: pnpm run lint
      - name: Build static export
        run: pnpm run build
        env:
          NEXT_PUBLIC_APP_URL: https://oussama.hichou.me
          NEXT_PUBLIC_GITHUB_PAGES_URL: https://usmhic.github.io

  container:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./portfolio
          file: ./portfolio/Dockerfile
          push: false
          tags: usmhic-site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
