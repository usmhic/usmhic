name: Deploy - osas.cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osas.cloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: osas.cloud/pnpm-lock.yaml

      - name: Enable and configure GitHub Pages
        if: ${{ env.PAGES_TOKEN != '' }}
        uses: actions/configure-pages@v6
        with:
          token: ${{ env.PAGES_TOKEN }}
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run types:check

      - name: Lint
        run: pnpm run lint

      - name: Build static site
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://osas.cloud
          NEXT_PUBLIC_GITHUB_PAGES_URL: https://usmhic.github.io

      - name: Prepare Pages artifact
        run: |
          touch out/.nojekyll
          cp public/CNAME out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: osas.cloud/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
